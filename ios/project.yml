# Run `xcodegen generate` in this directory to produce Marko.xcodeproj.
# Or skip xcodegen entirely: open Xcode, create a new iOS App named
# "Marko" with the SwiftData / SwiftUI templates, then drag the
# `Marko/` folder contents into the project navigator.

name: Marko
options:
  bundleIdPrefix: com.marko
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Marko/Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.marko.astro
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES

targets:
  Marko:
    type: application
    platform: iOS
    sources:
      - path: Marko
    configFiles:
      Debug: Marko/Resources/App.xcconfig
      Release: Marko/Resources/App.xcconfig
    info:
      path: Marko/Resources/Info.plist
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
